<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#certBg2)"/>

  <!-- Outer Border -->
  <rect x="25" y="25" width="750" height="550" rx="12" fill="none" stroke="#e2e8f0" stroke-width="3"/>
  <rect x="35" y="35" width="730" height="530" rx="8" fill="none" stroke="#0d9488" stroke-dasharray="10 5" stroke-width="1.5" opacity="0.6"/>

  <!-- Corner Ornaments -->
  <path d="M45,65 L45,45 L65,45" fill="none" stroke="#0d9488" stroke-width="3"/>
  <path d="M755,65 L755,45 L735,45" fill="none" stroke="#0d9488" stroke-width="3"/>
  <path d="M45,535 L45,555 L65,555" fill="none" stroke="#0d9488" stroke-width="3"/>
  <path d="M755,535 L755,555 L735,555" fill="none" stroke="#0d9488" stroke-width="3"/>

  <!-- Header -->
  <text x="400" y="110" font-family="'Georgia', serif" font-size="28" font-weight="700" letter-spacing="4" fill="#0f172a" text-anchor="middle">CERTIFICATE OF COMPLETION</text>
  <text x="400" y="145" font-family="system-ui, sans-serif" font-size="14" letter-spacing="3" fill="#64748b" text-anchor="middle">AWARDED TO</text>

  <!-- Recipient Name -->
  <text x="400" y="215" font-family="'Georgia', serif" font-size="34" font-weight="bold" fill="#0f766e" text-anchor="middle">Atharva Suryawanshi</text>
  <line x1="220" y1="235" x2="580" y2="235" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Description -->
  <text x="400" y="280" font-family="system-ui, sans-serif" font-size="16" fill="#334155" text-anchor="middle">In recognition of successful participation and excellence in</text>
  <text x="400" y="315" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#0f172a" text-anchor="middle">Data Structures, Algorithms &amp; Python Programming</text>

  <!-- Placeholder Badge / Guide -->
  <rect x="180" y="370" width="440" height="48" rx="24" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="400" y="400" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0f766e" text-anchor="middle">📷 Placeholder 2: Replace with your certificate image</text>

  <!-- Seal -->
  <g transform="translate(640, 440)">
    <circle cx="35" cy="35" r="38" fill="url(#gold2)"/>
    <circle cx="35" cy="35" r="30" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="35" y="39" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">HONORS</text>
  </g>

  <!-- Signatures Lines -->
  <line x1="140" y1="500" x2="300" y2="500" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="220" y="525" font-family="system-ui, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Instructor Signature</text>

  <line x1="420" y1="500" x2="580" y2="500" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="500" y="525" font-family="system-ui, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Credential ID</text>
</svg>
